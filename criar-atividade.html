<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar atividade — Portal do Saber</title>
<style>:root{font-family:system-ui,sans-serif;background:#f4f7fb;color:#152840}*{box-sizing:border-box}main{max-width:850px;margin:24px auto;padding:22px;background:white;border-radius:14px}h1{font-size:1.65rem}label{display:block;font-weight:650;margin:15px 0 5px}input,textarea,select,button{font:inherit;padding:11px;border-radius:7px}input,textarea,select{width:100%;border:1px solid #697c8f}textarea{min-height:85px}button{border:0;background:#1555a7;color:white;cursor:pointer;margin:10px 6px 0 0}button.alt{background:#3c5368}button:focus-visible,a:focus-visible{outline:3px solid #edaa27}fieldset{border:1px solid #bbc9d7;border-radius:9px;margin:18px 0;padding:15px}legend{font-weight:700}#aviso{min-height:30px}@media print{.acoes,.voltar,#aviso{display:none}main{padding:0;margin:0}body{background:white}fieldset{break-inside:avoid}}</style><link rel="stylesheet" href="tema-futurista.css">
</head>
<body><main><p class="voltar"><a href="planejar-aula.html">Voltar ao planejamento</a></p><h1>Criar atividade</h1><p>Prepare questões a partir do seu plano. Revise tudo antes de entregar aos alunos. Não inclua dados pessoais.</p>
<form id="form"><label for="titulo">Título</label><input id="titulo" maxlength="140" required><label for="orientacoes">Orientações ao aluno</label><textarea id="orientacoes" maxlength="2000">Leia as questões e responda com atenção.</textarea><label for="modo">Quando mostrar as respostas?</label><select id="modo" aria-describedby="notaModo"><option value="imediato">Exercício: depois de cada resposta</option><option value="final">Simulado: depois de finalizar</option><option value="professor">Avaliação: somente com autorização do professor</option></select><p id="notaModo">Exercícios e simulados são demonstrações locais de autocorreção, não provas protegidas.</p><div id="questoes"></div>
<div class="acoes"><button type="button" id="adicionar">Adicionar questão</button><button type="button" id="interativo">Baixar atividade interativa</button><button type="button" id="baixar">Baixar para o aluno</button><button type="button" id="baixarGabarito">Baixar gabarito do professor</button><button type="button" class="alt" id="imprimir">Imprimir atividade para aluno</button></div></form><p id="aviso" role="status" aria-live="polite"></p></main><script src="criar-atividade.js"></script></body></html>
