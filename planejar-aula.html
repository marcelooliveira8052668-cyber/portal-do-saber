<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planejar aula — Portal do Saber</title><style>:root{font-family:system-ui,sans-serif;color:#16243a;background:#f4f7fb}*{box-sizing:border-box}main{max-width:780px;margin:auto;padding:18px}article{background:white;padding:22px;border-radius:12px}label{display:block;font-weight:600;margin:14px 0 5px}input,select,textarea,button{font:inherit;padding:11px;border-radius:7px}input,select,textarea{width:100%;border:1px solid #65758b}textarea{min-height:90px;resize:vertical}button{border:0;background:#1455ad;color:white;margin:12px 8px 0 0;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #e59d00}button.alt{background:#3b4c60}button.danger{background:#a22a2a}#aviso{min-height:28px}a{color:#1455ad}@media print{.acoes,.voltar,#aviso{display:none}body{background:white}article{padding:0}}</style><link rel="stylesheet" href="tema-futurista.css">
</head><body><main><p class="voltar"><a href="index.html">Voltar ao Portal do Saber</a></p><article><h1>Planejamento de aula</h1><p>Preencha os campos e salve um arquivo com o plano. Não use nomes ou informações pessoais de alunos.</p><form id="plano"><label for="titulo">Título da aula</label><input id="titulo" maxlength="140" required><label for="etapa">Etapa</label><select id="etapa"><option>Fundamental I</option><option>Fundamental II</option><option>Ensino Médio</option><option>ENEM</option><option>Vestibulares</option><option>Concursos</option><option>Tecnologia</option><option>Pedagogia</option><option>Educação Inclusiva</option><option>Cursos livres</option></select><label for="disciplina">Disciplina</label><input id="disciplina" maxlength="100" required><label for="duracao">Duração (minutos)</label><input id="duracao" type="number" min="10" max="480" value="50" required><label for="objetivos">Objetivos de aprendizagem</label><textarea id="objetivos" maxlength="3000" required></textarea><label for="conteudos">Conteúdos</label><textarea id="conteudos" maxlength="5000" required></textarea><label for="metodologia">Como será a aula</label><textarea id="metodologia" maxlength="5000" required></textarea><label for="recursos">Materiais e recursos</label><textarea id="recursos" maxlength="3000"></textarea><label for="avaliacao">Como verificar a aprendizagem</label><textarea id="avaliacao" maxlength="3000" required></textarea><label for="adaptacoes">Acessibilidade e adaptações necessárias</label><textarea id="adaptacoes" maxlength="3000"></textarea><div class="acoes"><button type="button" id="salvar">Salvar neste navegador</button><button type="button" id="baixar">Baixar plano (.json)</button><button type="button" id="atividade">Criar atividade deste plano</button><button type="button" id="imprimir" class="alt">Imprimir / PDF</button><button type="button" id="apagar" class="danger">Apagar rascunho</button></div></form><p id="aviso" role="status" aria-live="polite"></p></article></main><script src="planejar-aula.js"></script></body></html>
